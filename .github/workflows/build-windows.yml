name: Build Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.16.0 pillow==11.3.0 -r windows/requirements.txt

      - name: Create VidLoom icon
        run: python windows/create_icon.py

      - name: Build desktop executable
        run: pyinstaller --clean --noconfirm windows/vidloom.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/VidLoom.exe')) { throw 'VidLoom.exe was not produced.' }
          $size = (Get-Item 'dist/VidLoom.exe').Length
          if ($size -lt 100000) { throw "VidLoom.exe looks invalid: $size bytes" }
          Write-Host "VidLoom.exe verified: $size bytes"

      - name: Prepare installer directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/dist | Out-Null
          Copy-Item 'dist/VidLoom.exe' 'windows/dist/VidLoom.exe' -Force

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "$env:GITHUB_WORKSPACE\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'windows/dist/VidLoom-Setup.exe')) { throw 'Installer was not produced.' }
          $size = (Get-Item 'windows/dist/VidLoom-Setup.exe').Length
          if ($size -lt 100000) { throw "Installer looks invalid: $size bytes" }
          Write-Host "VidLoom installer verified: $size bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VidLoom-Installer
          path: windows/dist/VidLoom-Setup.exe

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: VidLoom-Portable
          path: windows/dist/VidLoom.exe
